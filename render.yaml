services:
  - type: web
    name: varre-vila
    runtime: python
    region: ohio
    plan: free
    buildCommand: "./build.sh"
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: varre-vila-db-UNIVESP2026-2
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Produção é ambiente de demonstração acadêmica: os dados de exemplo
      # (mutirões, relatórios, contas admin/voluntario) são recriados a cada
      # deploy pelo populate_demo, que é idempotente. Esta variável é a trava
      # explícita que o comando exige fora de DEBUG.
      - key: LOAD_DEMO_DATA
        value: "1"

databases:
  - name: varre-vila-db-UNIVESP2026-2
    plan: free
    region: ohio
